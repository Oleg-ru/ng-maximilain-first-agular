@if (isAddingTask) {
  <app-new-task (closeModal)="onCloseAddTaskModal()" [userId]="userId"/>
}

<section id="tasks">
  <header>
    <h2>{{name}}`s Tasks</h2>
    <menu>
      <button (click)="onStartAddTask()">Add Task</button>
    </menu>
  </header>

  <ul>
    @for ( task of getUserTasks(); track task.id) {
      <li>
        <app-task [task]="task"/>
      </li>
    }
  </ul>
</section>
